<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
	
    <!-- CSS stylesheets -->
    <link rel = "stylesheet" href = "css/master.css"/>
    <link rel = "stylesheet" href = "css/meal_plan.css"/>

    <!-- Font Awesome for icons -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href = "https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap"
        rel="stylesheet"
    />


    <title>Meal Plan</title>


</head>
<!-- end of head -->


<body>

    <section class = "hero-page">

        <!-- Navigation bar -->
        <nav>
            <input type = "checkbox" id = "check">
            <a href="index.html" class="logo">
                <img src="images/app_logo.jpg" alt="Logo">
            </a>
            <label for="check" class="checkbtn">
                <i class="fas fa-bars"></i>
            </label>

            <ul>
                <li><a href="index.html" onClick="uncheckCheckbox()">Home</a></li>
                <li><a href="meal_plan.html" onClick="uncheckCheckbox()">Meal Plan</a></li>
                <li><a href="your_pantry.html" onClick="uncheckCheckbox()">Your Pantry</a></li>
                <li><a href="recipes.html" onClick="uncheckCheckbox()">Recipes</a></li>
                <li>
                    <a href="grocery_list.html" class="btn-nav" onClick="uncheckCheckbox()">Grocery List</a>
                </li>
            </ul>
        </nav>
        <!-- Navigation bar end -->

        <!-- Page header -->
        <div class = "pg_header">
            <h1 class = "header_name">Meal Plan</h1>
            <hr class = "solid">
        </div>
        <!-- End of page header -->
        
        <!-- Bottom container -->
        <div class = "bottom_container">
            <div class = "bottom_container">
                <main class="cards" id="cards-container">
                    <!-- Day cards go here -->
                </main>

                <!-- Clear Meal Plan button -->
                <div class="clear-button-container">
                    <button id="clear-meal-plan">Clear Meal Plan</button>
                </div>
            </div>
        </div>
    </section>

    <!-- Confimation pop up for clear meal plan button -->
    <div id="confirmPopup" class="confirm-popup">
        <div class="confirm-box">
            <p>Are you sure you want to clear the meal plan?</p>
            <button id="confirmYes">Yes</button>
            <button id="confirmNo">No</button>
        </div>
    </div>
    
    <!-- JavaScript logic -->
    <script src="js/meal_plan.js"></script>
</body>

</html>
