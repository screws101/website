<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- This is for responsiveness -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
	
    <!-- css link -->
    <link rel = "stylesheet" href = "css/master.css"/>
    <link rel = "stylesheet" href = "css/your_pantry.css"/>


    <!-- icon link -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    />

    <!-- font link -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href = "https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap"
        rel="stylesheet"
    />


    <title>Your Pantry</title>


</head>
<!-- end of head -->


<body>

    <section class = "hero-page">

        <!-- navbar -->
        <nav>
            <input type = "checkbox" id = "check">        <!-- invisible checkbox for menu -->
            <a href="index.html" class="logo">
                <img src="images/logo.png" alt="Logo">
            </a>
            <label for="check" class="checkbtn">        <!-- makes a label for the hamburger icon and links it to the checkbox with check -->
                <i class="fas fa-bars"></i>        <!-- when you click on it it toggles the checkbox state -->
            </label>

            <ul>
                <li><a href="index.html" onClick="uncheckCheckbox()">Home</a></li>
                <li><a href="meal_plan.html" onClick="uncheckCheckbox()">Meal Plan</a></li>
                <li><a href="your_pantry.html" onClick="uncheckCheckbox()">Your Pantry</a></li>
                <li><a href="recipes.html" onClick="uncheckCheckbox()">Recipes</a></li>
                <li>
                    <a href="grocery_list.html" class="btn-nav" onClick="uncheckCheckbox()">Grocery List</a>
                </li>
            </ul>
        </nav>
        <!-- navbar end -->

        <!-- Heropage content -->
        <div class = "pg_header">
            <h1 class = "header_name">Your Pantry</h1>
            <hr class = "solid">
        </div>
        
        <div class = "bottom_container">
            <div class="button-container">
                <button id="add-pantry-item-btn" class="btn-add-item">Add a Pantry Item</button>
            </div>
            <main class="cards" id="cards-container">
            </main>
        </div>
    </section>


    <!-- Include data.js -->
    <script src="js/data.js"></script>

    <!-- Include pantry.js -->
    <script src="js/pantry.js"></script>
</body>

</html>
