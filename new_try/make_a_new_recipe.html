<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
	
    <!-- CSS stylesheets -->
    <link rel = "stylesheet" href = "css/master.css"/>
    <link rel = "stylesheet" href = "css/make_a_new_recipe.css"/>


    <!-- Font Awesome for icons -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href = "https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap"
        rel="stylesheet"
    />


    <title>Make a New Recipe</title>


</head>
<!-- end of head -->


<body>

    <section class = "hero-page">

        <!-- Navigation bar -->
        <nav>
            <input type = "checkbox" id = "check">
            <a href="index.html" class="logo">
                <img src="images/app_logo.jpg" alt="Logo">
            </a>
            <label for="check" class="checkbtn">
                <i class="fas fa-bars"></i>
            </label>

            <ul>
                <li><a href="index.html" onClick="uncheckCheckbox()">Home</a></li>
                <li><a href="meal_plan.html" onClick="uncheckCheckbox()">Meal Plan</a></li>
                <li><a href="your_pantry.html" onClick="uncheckCheckbox()">Your Pantry</a></li>
                <li><a href="recipes.html" onClick="uncheckCheckbox()">Recipes</a></li>
                <li>
                    <a href="grocery_list.html" class="btn-nav" onClick="uncheckCheckbox()">Grocery List</a>
                </li>
            </ul>
        </nav>
        <!-- Navigation bar end -->

        <!-- Page header -->
        <div class = "pg_header">
            <h1 class = "header_name">Make a New Recipe</h1>
            <hr class = "solid">
        </div>
        <!-- End of page header -->
        
        <main>
            <!-- Bottom Container -->
            <div class = "bottom_container">

                <!-- Left half of bottom container -->
                <div class = "left-bottom">

                    <!-- Section to insert a recipe URL -->
                    <div class = "insert-url">
                        <p class = "label">INSERT URL</p>
                        <input type="url" placeholder="https://example.com" required>
                    </div>

                     <!-- Optional alternative to manually fill out instead of URL -->
                    <h3>OR</h3>

                    <!-- Input field for recipe name -->
                    <div class = "name">
                        <p class = "label">NAME</p>
                        <input type="text" placeholder="Enter recipe name">
                    </div>

                    <!-- Input for ingredients list -->
                    <div class="ingredients">
                        <p class="label">INGREDIENTS</p>
                        <div id="ingredient-list">
                          <!-- List of added ingredients displayed here (bullet points) -->
                          <ul id="ingredients-display"></ul>
                        </div>
                        <!-- Input to add new ingredient, finished by using Enter key -->
                        <input type="text" id="ingredient-input" placeholder="Enter an ingredient and press Enter">
                      </div>
                    
                      
                    <!-- Input for calorie amount -->
                      <div class = "calories">
                        <p class = "label">CALORIES</p>
                        <input type="number" placeholder="Enter recipe calories">
                    </div>

                    <!-- Input for protein amount -->
                    <div class = "protein">
                        <p class = "label">PROTEIN</p>
                        <input type="number" placeholder="Enter recipe protein">
                    </div>

                    <!-- Input for prep time in hours and minutes -->
                    <div class="prep-time">
                        <p class="label">PREP TIME</p>
                        <div>
                            <input id="prep-time-hours" type="number" min="0" placeholder="Hours" />
                            <input id="prep-time-minutes" type="number" min="0" placeholder="Minutes" />
                        </div>
                    </div>       
                    
                    <!-- Create/Submit button -->
                    <button class="btn_create">Create</button>
                </div>

                <!-- Divider -->
                <div class="divider"></div>

                <!-- Right half of bottom container -->
                <div class = "right-bottom">
                    <div class = "steps">
                        <p class = "label">ENTER STEPS</p>

                        <!-- All step inputs appear here -->
                        <div id="steps-container">
                            <!-- Step inputs add here -->
                            <div class="step" id="step-1">
                                <label>1.</label>
                                <input type="text" placeholder="Enter step">
                            </div>
                        </div>

                        <!-- Add step icon button -->
                        <button class="btn_add_step" id="add-step-button">
                            <img src="images/black_icon_plus copy.png" />
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </section>

    <!-- JavaScript logic -->
    <script src="js/make_a_new_recipe.js"></script>
</body>

</html>
