<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
	
    <!-- CSS stylesheets -->
    <link rel = "stylesheet" href = "css/master.css"/>
    <link rel = "stylesheet" href = "css/add_an_ingredient.css"/>


    <!-- Font Awesome for icons -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href = "https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap"
        rel="stylesheet"
    />


    <title>Add and Ingredient</title>


</head>
<!-- end of head -->


<body>

    <section class = "hero-page">

        <!-- Navigation bar -->
        <nav>
            <input type = "checkbox" id = "check">
            <a href="index.html" class="logo">
                <img src="images/app_logo.jpg" alt="Logo">
            </a>
            <label for="check" class="checkbtn">
                <i class="fas fa-bars"></i>
            </label>

            <ul>
                <li><a href="index.html" onClick="uncheckCheckbox()">Home</a></li>
                <li><a href="meal_plan.html" onClick="uncheckCheckbox()">Meal Plan</a></li>
                <li><a href="your_pantry.html" onClick="uncheckCheckbox()">Your Pantry</a></li>
                <li><a href="recipes.html" onClick="uncheckCheckbox()">Recipes</a></li>
                <li>
                    <a href="grocery_list.html" class="btn-nav" onClick="uncheckCheckbox()">Grocery List</a>
                </li>
            </ul>
        </nav>
        <!-- Navigation bar end -->

        <!-- Page header -->
        <div class = "pg_header">
            <h1 class = "header_name">Add an Ingredient</h1>
            <hr class = "solid">
        </div>
        <!-- End of page header -->
        
        <main>
            <!-- Ingredient form -->
            <form id="ingredient-form">
                <div class="bottom_container">
                    <!-- Left column -->
                    <div class="left-bottom">
                        <div class="name">
                            <p class="label">NAME</p>
                            <input id="name" type="text" placeholder="Enter ingredient name" required>
                        </div>
                        <div class="ammount">
                            <p class="label">AMOUNT</p>
                            <input id="quantity" type="number" placeholder="Enter quantity" required>
                        </div>
                        <div class="calories">
                            <p class="label">CALORIES</p>
                            <input id="calories" type="number" placeholder="Enter calories">
                        </div>
                        <div class="serving">
                            <p class="label">SERVING SIZE</p>
                            <input id="servingSize" type="number" placeholder="Enter serving size">
                        </div>
                        <button type="submit" class="btn_create">Create</button>
                    </div>
                    <!-- End of left column -->

                    <!-- Vertical divider -->
                    <div class="divider"></div>

                    <!-- Right column -->
                    <div class="right-bottom">
                        <div class="protein">
                            <p class="label">PROTEIN</p>
                            <input id="protein" type="number" placeholder="Enter protein">
                        </div>
                        <div class="carbs">
                            <p class="label">CARBS</p>
                            <input id="carbs" type="number" placeholder="Enter carbs">
                        </div>
                        <div class="fat">
                            <p class="label">FAT</p>
                            <input id="fat" type="number" placeholder="Enter fat">
                        </div>
                    </div>
                    <!-- End of right column -->
                </div>
            </form>
        </main>

    <!-- JavaScript logic -->
    <script src="js/add_an_ingredient.js"></script>
</body>

</html>
