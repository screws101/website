<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
	
    <!-- CSS stylesheets -->
    <link rel = "stylesheet" href = "css/master.css"/>
    <link rel = "stylesheet" href = "css/inspect.css"/>

    <!-- Font Awesome for icons -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href = "https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap"
        rel="stylesheet"
    />


    <title>Inspect</title>


</head>
<!-- end of head -->


<body>

    <section class = "hero-page">

        <!-- Navigation bar -->
        <nav>
            <input type = "checkbox" id = "check">
            <a href="index.html" class="logo">
                <img src="images/app_logo.jpg" alt="Logo">
            </a>
            <label for="check" class="checkbtn">
                <i class="fas fa-bars"></i>
            </label>

            <ul>
                <li><a href="index.html" onClick="uncheckCheckbox()">Home</a></li>
                <li><a href="meal_plan.html" onClick="uncheckCheckbox()">Meal Plan</a></li>
                <li><a href="your_pantry.html" onClick="uncheckCheckbox()">Your Pantry</a></li>
                <li><a href="recipes.html" onClick="uncheckCheckbox()">Recipes</a></li>
                <li>
                    <a href="grocery_list.html" class="btn-nav" onClick="uncheckCheckbox()">Grocery List</a>
                </li>
            </ul>
        </nav>
        <!-- Navigation bar end -->

        <!-- Page header -->
        <div class = "pg_header">
            <h1 class = "header_name">Inspect Recipe</h1>
            <hr class = "solid">
        </div>
        <!-- End of page header -->

        <!-- Bottom container/Main content for recipe details -->
        <div class = "bottom_container" >
            <!-- Recipe name (to be filled dynamically) -->
            <div id="name"></div>

            <!-- Preparation time -->
            <div id="prep">
                <p>Prep Time: </p>
            </div>

            <!-- URL recipe link -->
            <div id="url">
                <p>Link: </p>
            </div>

            <!-- Ingredient list section -->
            <div id="ingredients">
                <h2>Ingredients</h2>
                <hr class = "solid">
            </div>

            <!-- Step-by-step instructions section -->
            <div id="steps">
                <h2>Steps</h2>
                <hr class = "solid">
            </div>

            <!-- Calories content -->
            <div id="calories">
                <p>Calories:</p>
            </div>

            <!-- Protein content -->
            <div id="protein">
                <p>Protein:</p>
            </div>
        </div>
        <!-- End of bottom container -->
    </section>


    <!-- JavaScript logic -->
    <script src="js/inspect.js"></script>
</body>

</html>
