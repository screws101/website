<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
	
    <!-- CSS stylesheets -->
    <link rel = "stylesheet" href = "css/master.css"/>
    <link rel = "stylesheet" href = "css/grocery_list.css"/>


    <!-- Font Awesome for icons -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href = "https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap"
        rel="stylesheet"
    />


    <title>Grocery List</title>


</head>
<!-- end of head -->


<body>

    <section class = "hero-page">

        <!-- Navigation bar -->
        <nav>
            <input type = "checkbox" id = "check">
            <a href="index.html" class="logo">
                <img src="images/app_logo.jpg" alt="Logo">
            </a>
            <label for="check" class="checkbtn">
                <i class="fas fa-bars"></i>
            </label>

            <ul>
                <li><a href="index.html" onClick="uncheckCheckbox()">Home</a></li>
                <li><a href="meal_plan.html" onClick="uncheckCheckbox()">Meal Plan</a></li>
                <li><a href="your_pantry.html" onClick="uncheckCheckbox()">Your Pantry</a></li>
                <li><a href="recipes.html" onClick="uncheckCheckbox()">Recipes</a></li>
                <li>
                    <a href="grocery_list.html" class="btn-nav" onClick="uncheckCheckbox()">Grocery List</a>
                </li>
            </ul>
        </nav>
        <!-- Navigation bar end -->

        <!-- Page header -->
        <div class="pg_header">
            <div class="grocery-header">
                <h1 class="header_name">Grocery List</h1>
            </div>
            <hr class="solid">
        </div>
        <!-- End of page header -->
                

        <!-- Main content: grocery list actions and item cards -->
        <main id="grocery-list-container" class="grocery-list">
            <div class="grocery-actions">
                <!-- A-Z Sort button -->
                <button id="sort-list-btn" class="button">Sort A–Z</button>

                <!-- Clear List button -->
                <button id="clear-list-btn" class="button">Clear Grocery List</button>
            </div>
            <!-- Grocery cards go here -->
        </main>

        <!-- Add to Grocery List Button (with each card) -->
        <button id="add-item-btn" class="add-ingredient-btn">
            <img src="images/icons8-plus-50-no-pad copy.png" class="add_icon" alt="Add">
            add to grocery list
        </button>
    </section>

    <!-- JavaScript logic -->
    <script src="js/grocery_list.js"></script>
</body>

</html>
